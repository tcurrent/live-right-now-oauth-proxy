<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Right Now OAuth Proxy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0e0e10;
            color: #efeff1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #18181b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #9146ff;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 { margin-bottom: 0.5rem; font-size: 1.25rem; }
        p { color: #adadb8; font-size: 0.9rem; line-height: 1.4; }
        .error { color: #eb0400; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner" id="spinner"></div>
        <h2 id="status-heading">Connecting to OAuth Provider...</h2>
        <p id="status-text">Please wait while we establish authentication.</p>
    </div>

    <script>
        // CONFIGURATION
        const TWITCH_CLIENT_ID = "bsj8pbpnptei2b3q7zwp70gn14lptn"; // Replace with real Twitch Client ID
        const KICK_CLIENT_ID = "01M29F2N6HTHHC9E9YPASHHP0T";     // Replace with real Kick Client ID
        const REDIRECT_URI = "https://tcurrent.github.io/live-right-now-oauth-proxy/";
        const WORKER_URL = "https://live-right-now-oauth-proxy.tcurrent.workers.dev";

        // PKCE UTILITIES FOR KICK
        async function generatePKCE() {
            const array = new Uint8Array(32);
            window.crypto.getRandomValues(array);
            const verifier = btoa(String.fromCharCode(...array))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

            const encoder = new TextEncoder();
            const data = encoder.encode(verifier);
            const hash = await window.crypto.subtle.digest("SHA-256", data);
            const challenge = btoa(String.fromCharCode(...new Uint8Array(hash)))
                .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

            return { verifier, challenge };
        }

        // MAIN HANDLER
        async function handleOAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");
            const provider = urlParams.get("provider") || sessionStorage.getItem("oauth_provider");
            const callbackState = urlParams.get("state");
            const state = urlParams.get("state") || sessionStorage.getItem("oauth_state");
            const handoffProof = urlParams.get("handoff_proof") || sessionStorage.getItem("handoff_proof");

            // STEP 1: INITIAL REDIRECT TO AUTH PROVIDER
            if (!code) {
                if (!provider || !state || !handoffProof) {
                    showError("This authorization request is invalid or has expired.");
                    return;
                }

                sessionStorage.setItem("oauth_provider", provider);
                sessionStorage.setItem("oauth_state", state);
                sessionStorage.setItem("handoff_proof", handoffProof);

                if (provider === "twitch") {
                    const twitchAuthUrl = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=&state=${encodeURIComponent(state)}`;
                    window.location.href = twitchAuthUrl;
                } 
                else if (provider === "kick") {
                    const { verifier, challenge } = await generatePKCE();
                    sessionStorage.setItem("kick_code_verifier", verifier);

                    const kickAuthUrl = `https://id.kick.com/oauth/authorize?client_id=${KICK_CLIENT_ID}&redirect=127.0.0.1&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=code&scope=user%3Aread%20channel%3Aread&code_challenge=${challenge}&code_challenge_method=S256&state=${encodeURIComponent(state)}`;
                    window.location.href = kickAuthUrl;
                } 
                else {
                    showError(`Unsupported provider: ${provider}`);
                }
                return;
            }

            if (!provider || !state || !handoffProof || callbackState !== state) {
                showError("Authorization state validation failed. Return to RuneLite and try again.");
                return;
            }

            // STEP 2: HANDLE CALLBACK AND EXCHANGE CODE VIA CLOUDFLARE WORKER
            document.getElementById("status-heading").innerText = "Exchanging Access Credentials...";
            document.getElementById("status-text").innerText = "Finalizing secure authorization handoff.";

            try {
                const payload = {
                    provider: provider,
                    code: code,
                    state: state,
                    handoff_proof: handoffProof
                };

                if (provider === "kick") {
                    payload.code_verifier = sessionStorage.getItem("kick_code_verifier");
                }

                const response = await fetch(`${WORKER_URL}/exchange`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok || data.error) {
                    throw new Error(data.error_description || data.error || "Failed to exchange token.");
                }

                const handoffCode = data.handoff_code;
                if (!handoffCode) {
                    throw new Error("Failed to create secure authorization handoff.");
                }

                // STEP 3: FORWARD A SHORT-LIVED HANDOFF CODE TO RUNELITE
                document.getElementById("status-heading").innerText = "Redirecting to RuneLite...";
                document.getElementById("status-text").innerText = "Completing secure authorization handoff.";

                sessionStorage.clear();
                window.location.href = `http://127.0.0.1:4646/callback?provider=${encodeURIComponent(provider)}&handoff_code=${encodeURIComponent(handoffCode)}&state=${encodeURIComponent(state)}`;

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(message) {
            document.getElementById("spinner").style.display = "none";
            document.getElementById("status-heading").innerText = "Authentication Error";
            document.getElementById("status-heading").className = "error";
            document.getElementById("status-text").innerText = message;
        }

        // Run on page load
        handleOAuth();
    </script>
</body>
</html>
