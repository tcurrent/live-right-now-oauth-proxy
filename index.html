<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Right Now - OAuth</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #0f1015; color: #ffffff; }
        .card { background: #181a20; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; max-width: 420px; width: 100%; border: 1px solid #2b2f3a; }
        .spinner { border: 3px solid #2b2f3a; border-top: 3px solid #5356ff; border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .success { color: #00e676; }
        .error { color: #ff5252; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="title">Authenticating...</h2>
        <div id="loader" class="spinner"></div>
        <p id="status">Connecting...</p>
    </div>

    <script>
        // CONFIGURATION: Set your credentials and worker URL
        const TWITCH_CLIENT_ID = "YOUR_TWITCH_CLIENT_ID";
        const KICK_CLIENT_ID = "YOUR_KICK_CLIENT_ID";
        const WORKER_URL = "https://live-right-now-oauth-proxy.YOUR-SUBDOMAIN.workers.dev";

        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const provider = (urlParams.get('provider') || 'twitch').toLowerCase();
        const statePort = urlParams.get('state') || urlParams.get('port') || "4646";
        
        const currentUrl = window.location.origin + window.location.pathname;

        if (!code) {
            // Initiate provider redirect
            if (provider === 'twitch') {
                const scope = encodeURIComponent("user:read:email");
                window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${encodeURIComponent(currentUrl)}&response_type=code&scope=${scope}&state=${statePort}`;
            } else if (provider === 'kick') {
                const scope = encodeURIComponent("user:read");
                window.location.href = `https://id.kick.com/oauth/authorize?client_id=${KICK_CLIENT_ID}&redirect_uri=${encodeURIComponent(currentUrl)}&response_type=code&scope=${scope}&state=${statePort}`;
            } else {
                showError("Unsupported streaming provider requested.");
            }
        } else {
            document.getElementById('status').innerText = `Exchanging token with ${provider.toUpperCase()}...`;
            
            fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    provider: provider,
                    code: code,
                    redirect_uri: currentUrl
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.access_token) {
                    document.getElementById('status').innerText = "Sending authorization to RuneLite...";
                    
                    fetch(`http://localhost:${statePort}/callback?provider=${provider}&token=${data.access_token}`)
                        .then(() => {
                            document.getElementById('loader').style.display = 'none';
                            document.getElementById('title').innerText = "Success!";
                            document.getElementById('title').className = "success";
                            document.getElementById('status').innerText = "Connected! You may now close this browser tab.";
                        })
                        .catch(() => showError("Could not connect to RuneLite. Verify client is open."));
                } else {
                    showError(data.error_description || "Token authorization failed.");
                }
            })
            .catch(() => showError("Auth proxy server unreachable."));
        }

        function showError(msg) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('title').innerText = "Authentication Error";
            document.getElementById('title').className = "error";
            document.getElementById('status').innerText = msg;
        }
    </script>
</body>
</html>
